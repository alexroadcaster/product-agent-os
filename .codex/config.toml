default_permissions = ":workspace"

[agents]
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[agents.explorer]
config_file = "./agents/explorer.toml"

[agents.product-manager]
config_file = "./agents/product-manager.toml"

[agents.architect]
config_file = "./agents/architect.toml"

[agents.builder]
config_file = "./agents/builder.toml"

[agents.tester]
config_file = "./agents/tester.toml"

[agents.reviewer]
config_file = "./agents/reviewer.toml"

[agents.docs-maintainer]
config_file = "./agents/docs-maintainer.toml"

[agents.release-operator]
config_file = "./agents/release-operator.toml"

[agents.lifecycle-orchestrator]
config_file = "./agents/lifecycle-orchestrator.toml"

[agents.plugin-runtime-builder]
config_file = "./agents/plugin-runtime-builder.toml"

[agents.graph-cockpit-engineer]
config_file = "./agents/graph-cockpit-engineer.toml"

[agents.learning-loop-engineer]
config_file = "./agents/learning-loop-engineer.toml"

[agents.completion-skeptic]
config_file = "./agents/completion-skeptic.toml"

[agents.security-privacy-supply-chain-reviewer]
config_file = "./agents/security-privacy-supply-chain-reviewer.toml"

[agents.research-source-analyst]
config_file = "./agents/research-source-analyst.toml"

[product_agent_os.autonomy]
default_mode = "act_within_workspace_scope"
ask_only_when_blocked = true
read_before_edit = true
prefer_existing_patterns = true
avoid_project_rewrite = true
avoid_context_hoarding = true
require_current_evidence_before_completion = true
fresh_context_files = [
  ".codex/workflows/source-context-pack.md",
  ".codex/workflows/worktree-ownership.md",
  ".codex/workflows/task-plan-lifecycle.md",
  ".codex/workflows/control-plane-sync.md",
]

[product_agent_os.execution_budget]
writer_concurrency = 1
max_review_repair_cycles_per_slice = 2
independent_reviewer_windows_per_slice = 1
completion_skeptic_passes = 1
control_plane_sync_passes = 1
no_target_diff_timeout_minutes = 30
repeat_command_requires_changed_input = true
unchanged_check_result_policy = "do_not_repeat"
root_owns_lifecycle = true

[product_agent_os.skill_source]
canonical_root = "plugins/product-agent-os/skills"
cache_policy = "reference_only_never_mixed_with_repository_skill_of_same_name"
mixed_source_policy = "forbidden_within_run"
session_start_provenance = "canonical_path_and_sha256"

[product_agent_os.task_state_ownership]
machine_state = "source-owned task-group JSON"
task_detail = "concrete task-matrix plan"
current_session = ".codex/product-agent-os/lifecycle-state.json"
execution_evidence = "RUNLOG.md"
verification_ceiling = "TEST.md"

[product_agent_os.lifecycle_contract]
task_start_brief = ".codex/artifact-templates/task-start-brief.md"
completion_ledger = ".codex/artifact-templates/completion-ledger.md"
brief_schema = "task_start_brief_v2"
closure_contract = "product-agent-os-completion-ledger-v2"
ordinary_reporting = "concise_result_evidence_limits"
stop_policy = "advisory_no_chat_validation"
task_plan_lifecycle = ".codex/workflows/task-plan-lifecycle.md"
control_plane_sync = ".codex/workflows/control-plane-sync.md"
agent_context_contract = ".codex/evals/agent-context-contract.json"
lifecycle_state = ".codex/product-agent-os/lifecycle-state.json"
hook_policy = ".codex/hooks.json"
hook_template_mirror = ".codex/hooks/hooks.json"
chat_visibility = "required"
required_for = "large_high_risk_material_implementation_release_or_explicit_packet"
agent_instruction_policy = "root_only_lifecycle_subagents_return_result_packet"

[product_agent_os.reasoning]
discovery = "low"
product = "medium"
architecture = "high"
implementation = "medium"
debugging = "high"
verification = "high"
review = "high"
release = "high"
mechanical = "low"

[product_agent_os.model_migration]
family = "GPT-6"
baseline_policy = "Preserve each role's current reasoning effort, then compare the same effort and one lower on representative tasks."
role_policy = "Use GPT-6.1 Sol for engineering and complex decisions; GPT-6.1 Terra for docs and bounded exploration. Astra and Luna remain evaluation candidates."
activation_status = "config_pinned_behavioral_promotion_pending"
fresh_session_hook_verification_required = true
quality_cost_latency_eval_required = true

[product_agent_os.permission_contract]
enforcement = "parent_session_inherited"
role_restrictions = "behavioral_not_separate_sandbox"
default_profile = ":workspace"
read_only_roles = ["explorer", "reviewer", "release-operator", "completion-skeptic", "security-privacy-supply-chain-reviewer", "research-source-analyst"]
workspace_roles = ["product-manager", "architect", "builder", "tester", "docs-maintainer", "lifecycle-orchestrator", "plugin-runtime-builder", "graph-cockpit-engineer", "learning-loop-engineer"]

[product_agent_os.approval_contract]
external_writes = "explicit"
network_access = "explicit"
provider_or_model_calls = "explicit"
browser_automation = "explicit"
live_servers = "explicit"
git_stage_commit_push_pr = "explicit"
branch_or_worktree_creation = "explicit"
hooks_or_automation_activation = "explicit"
deployment_or_publication = "explicit"
permission_changes = "explicit"
global_config_changes = "forbidden"
destructive_commands = "explicit"

[workflows]
source_context_pack = ".codex/workflows/source-context-pack.md"
worktree_ownership = ".codex/workflows/worktree-ownership.md"
build_slice = ".codex/workflows/build-slice.md"
coding_standards = ".codex/workflows/coding-standards.md"
task_plan_lifecycle = ".codex/workflows/task-plan-lifecycle.md"
control_plane_sync = ".codex/workflows/control-plane-sync.md"
review_slice = ".codex/workflows/review-slice.md"

[evals]
agent_context_contract = ".codex/evals/agent-context-contract.json"

[product_agent_os]
project_name = "Codex Docs / Product-Agent OS"
project_profile = "python_docs_plugin"
current_focus = "Source-backed Product-Agent OS maintenance; active task routing is owned by PLAN.md and RUNLOG.md"
source_policy = "source files and current command evidence outrank generated views"
memory_policy = "memory is recall, not source truth"
completion_policy = "no done, fixed, verified, ready, or release claim without current evidence or explicit accepted gap"

[product_agent_os.agent_skill_routing]
source = "find-skills search, installed local skills, Product-Agent OS project docs, and official Codex skills/subagents documentation"
policy = "The parent config enables executable [[skills.config]] entries; custom agent TOML files may only disable inherited skills. This table records focused role routing for governance. Exact skill count is not a quality gate."
third_party_skill_policy = "Advisory only; project source files, current command evidence, and official OpenAI/Codex docs remain source truth."
external_action_policy = "Skills that can publish, create issues, call providers, use browser automation, or mutate external systems must be used in local-synthesis-only mode unless exact approval is granted."
installed_external_skill_status = "Validated on this host only. Absolute user-level paths are machine-local and require revalidation or vendoring before repository portability is claimed."
installed_external_skills = [
  "adk-evals",
  "antv-g6-graph",
  "changelog-writer",
  "dispatching-parallel-agents",
  "documentation-and-adrs",
  "documentation-writer",
  "executing-plans",
  "handoff",
  "improve-codebase-architecture",
  "qa",
  "security-review",
  "subagent-driven-development",
  "tdd",
  "to-prd",
  "verification-before-completion",
  "writing-plans",
]
installed_but_not_assigned = ["qa", "to-prd", "find-skills"]

[product_agent_os.agent_skill_routing.explorer]
top_skills = ["workspace-discovery-auditor", "improve-codebase-architecture", "documentation-and-adrs", "handoff", "graphify"]

[product_agent_os.agent_skill_routing.product-manager]
top_skills = ["requirements-author", "implementation-planner", "writing-plans", "documentation-and-adrs", "handoff"]

[product_agent_os.agent_skill_routing.architect]
