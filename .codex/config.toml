[product_agent_os.agent_skill_routing.reviewer]
top_skills = ["risk-reviewer", "completion-skeptic", "security-review", "verification-before-completion", "improve-codebase-architecture"]

[product_agent_os.agent_skill_routing.docs-maintainer]
top_skills = ["docs-maintainer", "documentation-writer", "documentation-and-adrs", "openai-docs", "changelog-writer"]

[product_agent_os.agent_skill_routing.release-operator]
