project_name = "Codex Docs / Product-Agent OS"
default_permissions = "product-agent-os-local-autonomy"

[permissions.product-agent-os-local-autonomy]
extends = ":workspace"
description = "Local workspace autonomy for Product-Agent OS maintenance. External, git, provider, browser, hook, automation, deploy, and permission-change surfaces remain approval-bound."

[permissions.product-agent-os-local-autonomy.filesystem.":workspace_roots"]
"." = "write"
".codex" = "write"
".codex/agents" = "write"
".codex/workflows" = "write"
".codex/artifact-templates" = "write"
".codex/evals" = "write"
".codex/product-agent-os" = "write"
"plugins/product-agent-os" = "write"
"tests/product_agent_os" = "write"
"docs" = "write"

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 3000

[agents.explorer]
config_file = "./agents/explorer.toml"

[agents.product-manager]
config_file = "./agents/product-manager.toml"

[agents.architect]
config_file = "./agents/architect.toml"

[agents.builder]
config_file = "./agents/builder.toml"

[agents.tester]
config_file = "./agents/tester.toml"

[agents.reviewer]
config_file = "./agents/reviewer.toml"

[agents.docs-maintainer]
config_file = "./agents/docs-maintainer.toml"

[agents.release-operator]
config_file = "./agents/release-operator.toml"

[agents.lifecycle-orchestrator]
config_file = "./agents/lifecycle-orchestrator.toml"

[agents.plugin-runtime-builder]
config_file = "./agents/plugin-runtime-builder.toml"

[agents.graph-cockpit-engineer]
config_file = "./agents/graph-cockpit-engineer.toml"

[agents.learning-loop-engineer]
config_file = "./agents/learning-loop-engineer.toml"

[agents.completion-skeptic]
config_file = "./agents/completion-skeptic.toml"

[agents.security-privacy-supply-chain-reviewer]
config_file = "./agents/security-privacy-supply-chain-reviewer.toml"

[agents.research-source-analyst]
config_file = "./agents/research-source-analyst.toml"

[product_agent_os.autonomy]
default_mode = "act_within_workspace_scope"
ask_only_when_blocked = true
read_before_edit = true
prefer_existing_patterns = true
avoid_project_rewrite = true
avoid_context_hoarding = true
require_current_evidence_before_completion = true
fresh_context_files = [
  ".codex/workflows/source-context-pack.md",
  ".codex/workflows/worktree-ownership.md",
  ".codex/workflows/build-slice.md",
  ".codex/workflows/coding-standards.md",
  ".codex/workflows/task-plan-lifecycle.md",
  ".codex/workflows/control-plane-sync.md",
  ".codex/workflows/review-slice.md",
  ".codex/artifact-templates/coding-standard-checklist.md",
  ".codex/evals/agent-context-contract.json",
  ".codex/hooks.json",
  ".codex/hooks/hooks.json",
  ".rules",
]

[product_agent_os.lifecycle_contract]
task_plan_lifecycle = ".codex/workflows/task-plan-lifecycle.md"
control_plane_sync = ".codex/workflows/control-plane-sync.md"
agent_context_contract = ".codex/evals/agent-context-contract.json"
lifecycle_state = ".codex/product-agent-os/lifecycle-state.json"
hook_policy = ".codex/hooks.json"
chat_visibility = "required"
required_for = "non_mechanical_tasks"
agent_instruction_policy = "reference_config_workflows_do_not_duplicate_contract"

[product_agent_os.reasoning]
discovery = "low"
product = "medium"
architecture = "high"
implementation = "medium"
debugging = "high"
verification = "high"
review = "high"
release = "high"
mechanical = "low"

[sandbox]
default_mode = "workspace-write"
read_only_roles = ["explorer", "reviewer", "release_operator", "completion_skeptic", "security_privacy_supply_chain_reviewer", "research_source_analyst"]
workspace_write_roles = ["product_manager", "architect", "builder", "tester", "docs_maintainer", "lifecycle_orchestrator", "plugin_runtime_builder", "graph_cockpit_engineer", "learning_loop_engineer"]

[approvals]
external_writes = "explicit"
network_access = "explicit"
provider_or_model_calls = "explicit"
browser_automation = "explicit"
live_servers = "explicit"
git_stage_commit_push_pr = "explicit"
branch_or_worktree_creation = "explicit"
hooks_or_automation_activation = "explicit"
deployment_or_publication = "explicit"
permission_changes = "explicit"
global_config_changes = "forbidden"
destructive_commands = "explicit"

[workflows]
source_context_pack = ".codex/workflows/source-context-pack.md"
worktree_ownership = ".codex/workflows/worktree-ownership.md"
build_slice = ".codex/workflows/build-slice.md"
coding_standards = ".codex/workflows/coding-standards.md"
task_plan_lifecycle = ".codex/workflows/task-plan-lifecycle.md"
control_plane_sync = ".codex/workflows/control-plane-sync.md"
review_slice = ".codex/workflows/review-slice.md"

[evals]
agent_context_contract = ".codex/evals/agent-context-contract.json"

[product_agent_os]
project_profile = "python_docs_plugin"
current_focus = "Codex Docs Product-Agent OS specialist agent-team expansion"
source_policy = "source files and current command evidence outrank generated views"
memory_policy = "memory is recall, not source truth"
completion_policy = "no done, fixed, verified, ready, or release claim without current evidence or explicit accepted gap"

[product_agent_os.agent_skill_routing]
source = "find-skills search, installed local skills, Product-Agent OS project docs, and official Codex skills/subagents documentation"
policy = "Agent TOML files own executable [[skills.config]] entries; this table records the audited top-5 skill routing for governance."
third_party_skill_policy = "Advisory only; project source files, current command evidence, and official OpenAI/Codex docs remain source truth."
external_action_policy = "Skills that can publish, create issues, call providers, use browser automation, or mutate external systems must be used in local-synthesis-only mode unless exact approval is granted."
installed_external_skill_status = "Installed to user-level .agents skills; Codex skill folders are present. PromptScript target may report unsupported global installation and is not used as Product-Agent OS evidence."
installed_external_skills = [
  "adk-evals",
  "antv-g6-graph",
  "changelog-writer",
  "dispatching-parallel-agents",
  "documentation-and-adrs",
  "documentation-writer",
  "executing-plans",
  "handoff",
  "improve-codebase-architecture",
  "qa",
  "security-review",
  "subagent-driven-development",
  "tdd",
  "to-prd",
  "verification-before-completion",
  "writing-plans",
]
installed_but_not_assigned = ["qa"]

[product_agent_os.agent_skill_routing.explorer]
top_skills = ["workspace-discovery-auditor", "improve-codebase-architecture", "documentation-and-adrs", "handoff", "graphify"]

[product_agent_os.agent_skill_routing.product-manager]
top_skills = ["requirements-author", "to-prd", "writing-plans", "documentation-and-adrs", "handoff"]

[product_agent_os.agent_skill_routing.architect]
top_skills = ["implementation-planner", "improve-codebase-architecture", "documentation-and-adrs", "python-design-patterns", "writing-plans"]

[product_agent_os.agent_skill_routing.builder]
top_skills = ["implementation-planner", "tdd", "python-code-style", "python-design-patterns", "executing-plans"]

[product_agent_os.agent_skill_routing.tester]
top_skills = ["test-eval-designer", "tdd", "adk-evals", "verification-before-completion", "completion-skeptic"]

[product_agent_os.agent_skill_routing.reviewer]
top_skills = ["risk-reviewer", "completion-skeptic", "security-review", "verification-before-completion", "improve-codebase-architecture"]

[product_agent_os.agent_skill_routing.docs-maintainer]
top_skills = ["docs-maintainer", "documentation-writer", "documentation-and-adrs", "openai-docs", "changelog-writer"]

[product_agent_os.agent_skill_routing.release-operator]
top_skills = ["pr-release-operator", "changelog-writer", "verification-before-completion", "risk-reviewer", "documentation-and-adrs"]

[product_agent_os.agent_skill_routing.lifecycle-orchestrator]
top_skills = ["project-lifecycle-orchestrator", "workspace-discovery-auditor", "agent-team-designer", "subagent-driven-development", "dispatching-parallel-agents"]

[product_agent_os.agent_skill_routing.plugin-runtime-builder]
top_skills = ["implementation-planner", "python-code-style", "python-design-patterns", "tdd", "executing-plans"]

[product_agent_os.agent_skill_routing.graph-cockpit-engineer]
top_skills = ["workspace-discovery-auditor", "test-eval-designer", "graphify", "antv-g6-graph", "documentation-and-adrs"]

