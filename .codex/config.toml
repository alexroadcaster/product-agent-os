[product_agent_os.agent_skill_routing.learning-loop-engineer]
top_skills = ["learning-loop-maintainer", "automation-promoter", "test-eval-designer", "adk-evals", "verification-before-completion"]

[product_agent_os.agent_skill_routing.completion-skeptic]
