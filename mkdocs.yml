site_name: Product-Agent OS
site_description: Документация Product-Agent OS для рабочих процессов с агентами и skills.
site_url: ""
docs_dir: docs
site_dir: site
repo_url: ""
use_directory_urls: false

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: deep orange

extra:
  generator: false
  alternate:
    - name: RU
      link: /
      lang: ru
    - name: EN
      link: /en/
      lang: en

extra_css:
  - assets/stylesheets/extra.css

plugins:
  # Provided by mkdocs-static-i18n.
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: false
      languages:
        - locale: ru
          name: RU
          default: true
          build: true
          link: /
          site_name: Product-Agent OS
          site_description: Документация Product-Agent OS для рабочих процессов с агентами и skills.
          theme:
            language: ru
        - locale: en
          name: EN
          build: true
          link: /en/
          site_name: Product-Agent OS Documentation
          site_description: Product documentation for Product-Agent OS.
          theme:
            language: en
