site_name: OpenAI Codex Knowledge Base
site_description: Russian knowledge base for advanced OpenAI Codex and agentic workflows.
site_url: ""
docs_dir: docs
site_dir: site
repo_url: ""
use_directory_urls: false

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: deep orange

extra:
  generator: false

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  # Batch 34 accepted gap: Mermaid loads from CDN in this docs site.
  # Vendor/offline asset packaging remains a follow-up before offline-only publishing.
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

