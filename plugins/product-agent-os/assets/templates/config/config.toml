sandbox_mode = "workspace-write"

[agents]
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[agents.product-manager]
config_file = "./agents/product-manager.toml"

[agents.architect]
config_file = "./agents/architect.toml"

[agents.explorer]
config_file = "./agents/explorer.toml"

[agents.builder]
config_file = "./agents/builder.toml"

[agents.tester]
config_file = "./agents/tester.toml"

[agents.reviewer]
config_file = "./agents/reviewer.toml"

[agents.docs-maintainer]
config_file = "./agents/docs-maintainer.toml"

[agents.release-operator]
config_file = "./agents/release-operator.toml"

[product_agent_os]
project_name = "{project_name}"
project_profile = "{profile_name}"
control_plane = ["AGENTS.md", "REQUIREMENTS.md", "PLAN.md", "TEST.md", "EVALS.md", "RUNLOG.md"]
workflow_dir = ".codex/workflows"
runlog_archive_dir = ".codex/runlogs/archive"
automation_candidate_dir = ".codex/automation-candidates"

[product_agent_os.autonomy]
fresh_context_files = [
  ".codex/workflows/source-context-pack.md",
  ".codex/workflows/worktree-ownership.md",
  ".codex/workflows/task-plan-lifecycle.md",
  ".codex/workflows/control-plane-sync.md",
]

[product_agent_os.execution_budget]
writer_concurrency = 1
max_review_repair_cycles_per_slice = 2
independent_reviewer_windows_per_slice = 1
completion_skeptic_passes = 1
control_plane_sync_passes = 1
no_target_diff_timeout_minutes = 30
repeat_command_requires_changed_input = true
unchanged_check_result_policy = "do_not_repeat"
root_owns_lifecycle = true

[product_agent_os.skill_source]
canonical_root = "plugins/product-agent-os/skills"
cache_policy = "reference_only_never_mixed_with_repository_skill_of_same_name"
mixed_source_policy = "forbidden_within_run"
session_start_provenance = "canonical_path_and_sha256"

[product_agent_os.task_state_ownership]
machine_state = "source-owned task-group JSON"
task_detail = "concrete task-matrix plan"
current_session = ".codex/product-agent-os/lifecycle-state.json"
execution_evidence = "RUNLOG.md"
verification_ceiling = "TEST.md"

[product_agent_os.reasoning]
planning = "high"
building = "medium"
review = "high"
mechanical = "low"

[product_agent_os.model_migration]
family = "GPT-5.6"
baseline_policy = "Preserve each role's current reasoning effort, then compare the same effort and one lower on representative tasks."
role_policy = "Use Sol for complex judgment and Terra for everyday or read-heavy work; keep Luna candidate-only until a bounded eval passes."
activation_status = "config_pinned_behavioral_promotion_pending"
fresh_session_hook_verification_required = true
quality_cost_latency_eval_required = true

[product_agent_os.sandbox_contract]
default_mode = "workspace-write"
read_only_roles = ["architect", "explorer", "reviewer", "release-operator"]
workspace_write_roles = ["product-manager", "builder", "tester", "docs-maintainer"]

[product_agent_os.approval_contract]
external_writes = "explicit"
network_access = "explicit"
provider_or_model_calls = "explicit"
browser_automation = "explicit"
git_stage_commit_push_pr = "explicit"
hooks_or_automation_activation = "explicit"
deployment_or_publication = "explicit"
permission_changes = "explicit"
global_config_changes = "forbidden"

[product_agent_os.codex_agentic_workflow]
methodology = "codex_agentic_workflow"
runtimes = ["Codex App", "CLI", "IDE extension", "codex exec", "GitHub Action", "MCP", "Agents SDK", "automation"]
gates = [
  "agentic_scope_classified",
  "control_plane_present",
  "source_of_truth_present",
  "read_only_discovery_complete",
  "model_reasoning_policy_present",
  "fresh_context_handoff_present",
  "ownership_split_present",
  "subagent_parallelism_safe",
  "approval_boundary_present",
  "mcp_permission_review_present",
  "hook_activation_approval_present",
  "plugin_boundary_present",
  "skill_promotion_evidence_present",
  "automation_manual_stability_present",
  "agent_eval_workflow_present",
  "memory_policy_present",
  "agentic_evidence_before_completion",
]
statuses = ["present_unverified", "explicit_gap_accepted", "approval_required"]
memory_policy = "memory as recall only"
activation_policy = "no silent activation"

[product_agent_os.lifecycle_contract]
task_plan_lifecycle = ".codex/workflows/task-plan-lifecycle.md"
control_plane_sync = ".codex/workflows/control-plane-sync.md"
agent_context_contract = ".codex/evals/agent-context-contract.json"
lifecycle_state = ".codex/product-agent-os/lifecycle-state.json"
hook_policy = ".codex/hooks.json"
hook_template_mirror = ".codex/hooks/hooks.json"
chat_visibility = "required"
required_for = "non_mechanical_tasks"
agent_instruction_policy = "root_only_lifecycle_subagents_return_result_packet"

[workflows]
source_context_pack = ".codex/workflows/source-context-pack.md"
worktree_ownership = ".codex/workflows/worktree-ownership.md"
build_slice = ".codex/workflows/build-slice.md"
task_plan_lifecycle = ".codex/workflows/task-plan-lifecycle.md"
control_plane_sync = ".codex/workflows/control-plane-sync.md"
review_slice = ".codex/workflows/review-slice.md"
project_formation = ".codex/workflows/project-formation.md"
pr_review_readiness = ".codex/workflows/pr-review-readiness.md"
legacy_onboarding = ".codex/workflows/legacy-onboarding.md"
api_migration = ".codex/workflows/api-migration.md"
ai_eval_regression = ".codex/workflows/ai-eval-regression.md"
native_mobile_feature = ".codex/workflows/native-mobile-feature.md"
desktop_local_first = ".codex/workflows/desktop-local-first.md"
data_migration = ".codex/workflows/data-migration.md"
security_sensitive_change = ".codex/workflows/security-sensitive-change.md"
ci_stabilization = ".codex/workflows/ci-stabilization.md"
release_packaging = ".codex/workflows/release-packaging.md"
release_packet = ".codex/workflows/release-packet.md"
runlog_compaction = ".codex/workflows/runlog-compaction.md"

[evals]
agent_context_contract = ".codex/evals/agent-context-contract.json"
