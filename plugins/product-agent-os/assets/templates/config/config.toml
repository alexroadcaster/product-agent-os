profile = "{profile_name}"
project_name = "{project_name}"

[agents]
default_profile = "{profile_name}"
max_parallel = 2
product_manager = ".codex/agents/product-manager.toml"
architect = ".codex/agents/architect.toml"
explorer = ".codex/agents/explorer.toml"
builder = ".codex/agents/builder.toml"
tester = ".codex/agents/tester.toml"
reviewer = ".codex/agents/reviewer.toml"
docs_maintainer = ".codex/agents/docs-maintainer.toml"
release_operator = ".codex/agents/release-operator.toml"

[agents.reasoning]
planning = "high"
building = "medium"
review = "high"
mechanical = "low"

[sandbox]
default_mode = "workspace-write"
read_only_for = ["planning", "review", "release"]

[approvals]
external_writes = "explicit"
network_access = "explicit"
permission_changes = "explicit"
automation_activation = "explicit"
global_config_changes = "forbidden"

[product_agent_os.codex_agentic_workflow]
methodology = "codex_agentic_workflow"
runtimes = ["Codex App", "CLI", "IDE extension", "codex exec", "GitHub Action", "MCP", "Agents SDK", "automation"]
gates = [
  "agentic_scope_classified",
  "control_plane_present",
  "source_of_truth_present",
  "read_only_discovery_complete",
  "model_reasoning_policy_present",
  "fresh_context_handoff_present",
  "ownership_split_present",
  "subagent_parallelism_safe",
  "approval_boundary_present",
  "mcp_permission_review_present",
  "hook_activation_approval_present",
  "plugin_boundary_present",
  "skill_promotion_evidence_present",
  "automation_manual_stability_present",
  "agent_eval_workflow_present",
  "memory_policy_present",
  "agentic_evidence_before_completion",
]
statuses = ["present_unverified", "explicit_gap_accepted", "approval_required"]
memory_policy = "memory as recall only"
activation_policy = "no silent activation"

[workflows]
source_context_pack = ".codex/workflows/source-context-pack.md"
worktree_ownership = ".codex/workflows/worktree-ownership.md"
build_slice = ".codex/workflows/build-slice.md"
review_slice = ".codex/workflows/review-slice.md"
pr_review_readiness = ".codex/workflows/pr-review-readiness.md"
legacy_onboarding = ".codex/workflows/legacy-onboarding.md"
api_migration = ".codex/workflows/api-migration.md"
ai_eval_regression = ".codex/workflows/ai-eval-regression.md"
native_mobile_feature = ".codex/workflows/native-mobile-feature.md"
desktop_local_first = ".codex/workflows/desktop-local-first.md"
data_migration = ".codex/workflows/data-migration.md"
security_sensitive_change = ".codex/workflows/security-sensitive-change.md"
ci_stabilization = ".codex/workflows/ci-stabilization.md"
release_packaging = ".codex/workflows/release-packaging.md"
release_packet = ".codex/workflows/release-packet.md"
runlog_compaction = ".codex/workflows/runlog-compaction.md"

[product_agent_os]
control_plane = ["AGENTS.md", "REQUIREMENTS.md", "PLAN.md", "TEST.md", "EVALS.md", "RUNLOG.md"]
workflow_dir = ".codex/workflows"
runlog_archive_dir = ".codex/runlogs/archive"
automation_candidate_dir = ".codex/automation-candidates"
