profile = "{profile_name}"
project_name = "{project_name}"

[agents]
default_profile = "{profile_name}"
max_parallel = 2
product_manager = ".codex/agents/product-manager.toml"
architect = ".codex/agents/architect.toml"
explorer = ".codex/agents/explorer.toml"
builder = ".codex/agents/builder.toml"
tester = ".codex/agents/tester.toml"
reviewer = ".codex/agents/reviewer.toml"
docs_maintainer = ".codex/agents/docs-maintainer.toml"
release_operator = ".codex/agents/release-operator.toml"

[agents.reasoning]
planning = "high"
building = "medium"
review = "high"
mechanical = "low"

[sandbox]
default_mode = "workspace-write"
read_only_for = ["planning", "review", "release"]

[approvals]
external_writes = "explicit"
network_access = "explicit"
permission_changes = "explicit"
automation_activation = "explicit"
global_config_changes = "forbidden"

[workflows]
source_context_pack = ".codex/workflows/source-context-pack.md"
worktree_ownership = ".codex/workflows/worktree-ownership.md"
build_slice = ".codex/workflows/build-slice.md"
review_slice = ".codex/workflows/review-slice.md"
release_packet = ".codex/workflows/release-packet.md"
runlog_compaction = ".codex/workflows/runlog-compaction.md"

[product_agent_os]
control_plane = ["AGENTS.md", "REQUIREMENTS.md", "PLAN.md", "TEST.md", "EVALS.md", "RUNLOG.md"]
workflow_dir = ".codex/workflows"
runlog_archive_dir = ".codex/runlogs/archive"
automation_candidate_dir = ".codex/automation-candidates"
